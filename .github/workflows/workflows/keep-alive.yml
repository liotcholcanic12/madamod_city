name: Keep Supabase Awake

on:
  schedule:
    # Runs every 4 days at 6:00 AM UTC — well under Supabase's ~7-day pause threshold
    - cron: '0 6 */4 * *'
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cities?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"