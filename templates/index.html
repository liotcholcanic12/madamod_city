<!DOCTYPE html>
<html>
<head>
    <title>School Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Madamod & المنشاة Task Tracker</h1>
        <div class="alert alert-success">✅ Vercel deployment successful!</div>
        <h3>Cities:</h3>
        <ul id="cities"></ul>
    </div>
    <script>
        fetch('/api/cities')
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('cities');
                data.forEach(city => {
                    const li = document.createElement('li');
                    li.textContent = city.name;
                    list.appendChild(li);
                });
            });
    </script>
</body>
</html>
