[project]
name = "school-task-tracker"
version = "1.0.0"
description = "School Task Tracker Application"
requires-python = ">=3.8"
dependencies = [
    "Flask==2.3.3",
    "openpyxl==3.1.2",
    "python-dotenv==1.0.0",
    "gunicorn==21.2.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
